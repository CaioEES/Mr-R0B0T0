# Copie para config.yaml e ajuste.
# REGRA: só coloque aqui canais com AUTORIZAÇÃO (campanha de clipping ou acordo escrito).

data_dir: data

channels:
  - name: "Streamer Exemplo"
    url: "https://www.youtube.com/@canal_exemplo/streams"   # ou /videos, ou twitch.tv/<user>/videos
    authorization: "Whop campaign XYZ / e-mail de 2026-11-10"  # obrigatório: prova da permissão
    max_videos: 2            # quantos VODs mais recentes checar por rodada
    credit: "@canal_exemplo" # vai na descrição de cada corte

ingest:
  max_height: 1080
  max_duration_min: 360      # ignora lives maiores que isso
  download_chat: true        # live chat replay (YouTube) melhora muito a detecção

transcribe:
  model: "small"             # tiny | base | small | medium | large-v3 (GPU recomendado acima de small)
  language: "pt"
  device: "auto"             # auto | cpu | cuda
  compute_type: "int8"

detect:
  window_s: 1.0
  pre_roll_s: 20             # segundos antes do pico
  post_roll_s: 10            # segundos depois do pico
  min_clip_s: 15
  max_clip_s: 59             # Shorts/Reels/TikTok
  top_n: 15                  # candidatos enviados ao ranqueamento
  weights: {audio: 0.35, chat: 0.45, keywords: 0.20}

llm:
  enabled: true              # requer ANTHROPIC_API_KEY
  model: "claude-opus-5-5"
  effort: "low"
  keep_top: 5                # cortes gerados por vídeo

render:
  width: 1080
  height: 1920
  font: "DejaVu Sans"
  font_size: 78
  crf: 20

publish:
  youtube:
    enabled: false
    client_secrets: "secrets/client_secret.json"   # OAuth desktop app (Google Cloud Console)
    token_file: "secrets/youtube_token.json"
    privacy: "private"       # comece em private/unlisted até validar
    category_id: "20"        # Gaming
  daily_limit: 5             # máximo de publicações por dia (anti-spam)
